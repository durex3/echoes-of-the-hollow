name: Godot project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot and verify archive
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $archive = 'Godot_v4.7.2-stable_win64.exe.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $zipPath = Join-Path $destination $archive
          Invoke-WebRequest -Uri "$base/$archive" -OutFile $zipPath
          $sums = (Invoke-WebRequest -Uri "$base/SHA512-SUMS.txt").Content
          if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
          $entry = ($sums -split "`n") | Where-Object { $_.Trim().EndsWith($archive) }
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA512).Hash.ToLower()
          if (-not $entry -or -not $entry.StartsWith($actual)) { throw 'Checksum mismatch' }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $destination
          "GODOT_BIN=$destination\Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Project gates
        shell: pwsh
        run: .\tools\check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: artifacts/*.log
